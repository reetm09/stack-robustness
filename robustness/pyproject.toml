[project]
name = "stack-quality"
version = "0.1.0"
description = "Study 3: robustness of STACK, TabPFN-3.5 and baselines to data-quality shifts (CS 182 final project)"
requires-python = ">=3.11"
dependencies = [
    "stack-robustness",
    "stack-ttt",
    "tabpfn>=10.2",
    "scikit-learn>=1.3",
    "tabulate",
]

[dependency-groups]
dev = ["pytest>=8", "nbformat", "nbclient", "matplotlib"]

[tool.uv.sources]
stack-robustness = { path = "..", editable = true }
stack-ttt = { path = "../ttt", editable = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The 'future.infer_string' option is deprecated",
]
