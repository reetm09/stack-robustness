[project]
name = "stack-compositional"
version = "0.1.0"
description = "Experiment 2: combinatorial perturbation prediction with STACK on Norman et al. (2019)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stack-robustness",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Only the GPU steps (running STACK itself) need these.
stack = ["arc-stack==0.1.3", "torch>=2.1"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
stack-robustness = { path = "..", editable = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'future.infer_string' option is deprecated"]
