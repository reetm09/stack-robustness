[project]
name = "stack-cellline"
version = "0.1.0"
description = "Study 1: fine-tune STACK on a target cell line for comparison with zero-shot STACK"
requires-python = ">=3.11"
dependencies = [
    "stack-robustness",
    "stack-ttt",
    "arc-stack==0.1.3",  # the same pin as ttt/; the adapters and loss rely on this version's internals
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
stack-robustness = { path = "..", editable = true }
stack-ttt = { path = "../ttt", editable = true }

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:The 'future.infer_string' option is deprecated",
    "ignore:Observation names are not unique",
]
